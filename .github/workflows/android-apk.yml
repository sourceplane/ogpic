name: Android APK (Capacitor)

# Builds an Android APK with Capacitor that wraps the LIVE Rondo web app in a
# native WebView — no browser address bar. `server.url` in
# capacitor-app/capacitor.config.json points at production, so the app loads the
# UI online (nothing is bundled) and always shows the deployed UI.
#
# Run from the Actions tab ("Run workflow") or by pushing an `apk-*` tag. The
# signed debug APK is attached to a GitHub Release (a stable download link) and
# uploaded as a build artifact. A debug APK is used so it installs by sideload
# with no signing setup; it is not for Play Store distribution.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the APK under"
        required: false
        default: "android-latest"
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor deps
        working-directory: capacitor-app
        run: npm install

      - name: Add Android platform
        working-directory: capacitor-app
        run: npx cap add android

      - name: Generate app icons (branded launcher icon)
        working-directory: capacitor-app
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0E1B14" --iconBackgroundColorDark "#0E1B14" || echo "icon generation skipped — using defaults"

      - name: Sync web assets + config into the Android project
        working-directory: capacitor-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: capacitor-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        working-directory: capacitor-app
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rondo.apk
          ls -la rondo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rondo-apk
          path: capacitor-app/rondo.apk
          if-no-files-found: error

      - name: Publish GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          [ -z "$TAG" ] && TAG="android-latest"
          NOTES=$'Capacitor (native WebView) build of Rondo — no browser address bar.\n\nLoads the live UI from https://ogpic-web-console-next-prod.rahulvarghesepullely.workers.dev/rondo — nothing is bundled, so it always shows the deployed UI.\n\nInstall on Android: download rondo.apk, allow "install unknown apps" for your browser/files app, then open it.'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" capacitor-app/rondo.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" capacitor-app/rondo.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rondo (Android)" \
              --notes "$NOTES"
          fi
          echo "Release: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
