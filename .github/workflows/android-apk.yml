name: Android APK (Capacitor)

# Builds an Android APK with Capacitor that wraps the LIVE Rondo web app in a
# native WebView — no browser address bar. `server.url` in
# capacitor-app/capacitor.config.json points at production, so the app loads the
# UI online (nothing is bundled) and always shows the deployed UI.
#
# Run from the Actions tab ("Run workflow") and pick a variant, or push an
# `apk-*` tag (defaults to prod):
#   - prod → production URL, real email login → Release tag `android-latest`
#   - dev  → stage URL (backend runs in local_debug, so the login screen shows
#            the DEV CODE), separate appId so it installs alongside prod →
#            Release tag `android-dev`
# The signed debug APK is attached to a GitHub Release (a stable download link)
# and uploaded as a build artifact. A debug APK is used so it installs by
# sideload with no signing setup; it is not for Play Store distribution.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which build to produce"
        required: true
        type: choice
        default: prod
        options:
          - prod
          - dev
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor deps
        working-directory: capacitor-app
        run: npm install

      - name: Configure build variant
        working-directory: capacitor-app
        run: |
          # prod → production URL (real email login); dev → stage URL, which the
          # backend serves in local_debug mode so the login screen shows the DEV
          # CODE. A distinct appId/name lets the dev app install alongside prod.
          VARIANT="${{ github.event.inputs.variant || 'prod' }}"
          if [ "$VARIANT" = "dev" ]; then
            export CAP_URL="https://ogpic-web-console-next-stage.rahulvarghesepullely.workers.dev/rondo"
            export CAP_APPID="ai.sourceplane.rondo.dev"
            export CAP_APPNAME="Rondo Dev"
            echo "TAG=android-dev" >> "$GITHUB_ENV"
            echo "TITLE=Rondo Dev (Android)" >> "$GITHUB_ENV"
          else
            export CAP_URL="https://ogpic-web-console-next-prod.rahulvarghesepullely.workers.dev/rondo"
            export CAP_APPID="ai.sourceplane.rondo"
            export CAP_APPNAME="Rondo"
            echo "TAG=android-latest" >> "$GITHUB_ENV"
            echo "TITLE=Rondo (Android)" >> "$GITHUB_ENV"
          fi
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const p = "capacitor.config.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.appId = process.env.CAP_APPID;
            c.appName = process.env.CAP_APPNAME;
            c.server = { ...(c.server || {}), url: process.env.CAP_URL };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("Built variant:", process.env.VARIANT, c.appId, c.server.url);
          '

      - name: Add Android platform
        working-directory: capacitor-app
        run: npx cap add android

      - name: Enable edge-to-edge full-screen (transparent system bars)
        working-directory: capacitor-app
        run: |
          # The StatusBar plugin overlays the WebView under the status bar; this
          # makes the navigation bar transparent and lets content draw into the
          # display cutout too, so the app is truly edge-to-edge. Best-effort:
          # if the template's style block moves, we skip rather than fail.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/res/values/styles.xml")
          if not p.exists():
              print("styles.xml not found — skipping edge-to-edge patch"); raise SystemExit(0)
          s = p.read_text()
          if "navigationBarColor" in s:
              print("already patched"); raise SystemExit(0)
          items = (
              '\n        <item name="android:statusBarColor">@android:color/transparent</item>'
              '\n        <item name="android:navigationBarColor">@android:color/transparent</item>'
              '\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>'
          )
          m = re.search(r'(<style name="AppTheme\.NoActionBar"[^>]*>)', s)
          if not m:
              print("AppTheme.NoActionBar not found — skipping"); raise SystemExit(0)
          s = s[:m.end()] + items + s[m.end():]
          p.write_text(s)
          print("patched styles.xml for edge-to-edge")
          PY

      - name: Generate app icons (branded launcher icon)
        working-directory: capacitor-app
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0E1B14" --iconBackgroundColorDark "#0E1B14" || echo "icon generation skipped — using defaults"

      - name: Sync web assets + config into the Android project
        working-directory: capacitor-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: capacitor-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        working-directory: capacitor-app
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rondo.apk
          ls -la rondo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rondo-apk
          path: capacitor-app/rondo.apk
          if-no-files-found: error

      - name: Publish GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # TAG/TITLE come from the Configure step; fall back to prod for tag pushes.
          TAG="${TAG:-android-latest}"
          TITLE="${TITLE:-Rondo (Android)}"
          if [ "${VARIANT:-prod}" = "dev" ]; then
            URL="https://ogpic-web-console-next-stage.rahulvarghesepullely.workers.dev/rondo"
            EXTRA='This is the DEV build: it points at the stage environment, where the login screen shows the DEV CODE (no real email needed). Installs alongside the prod app.'
          else
            URL="https://ogpic-web-console-next-prod.rahulvarghesepullely.workers.dev/rondo"
            EXTRA='This is the PROD build.'
          fi
          NOTES=$(printf 'Capacitor (native WebView) build of Rondo — no browser address bar.\n\n%s\n\nLoads the live UI from %s — nothing is bundled, so it always shows the deployed UI.\n\nInstall on Android: download rondo.apk, allow "install unknown apps" for your browser/files app, then open it.' "$EXTRA" "$URL")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" capacitor-app/rondo.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" capacitor-app/rondo.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
          echo "Release: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
